# Docker-to-LXC Default Configuration
# Copy this file and customize for your deployment
#
# Usage:
#   1. Copy this file: cp default.conf myapp.conf
#   2. Edit the configuration
#   3. Run: ./docker-service.sh --config myapp.conf
#
# Or set environment variables before running the script

# =============================================================================
# CONTAINER SETTINGS
# =============================================================================

# CPU cores allocated to the container
var_cpu="2"

# Memory in MB
var_ram="2048"

# Disk size in GB
var_disk="8"

# Operating system (debian, ubuntu, alpine)
var_os="debian"

# OS version (e.g., 12 for Debian, 24.04 for Ubuntu)
var_version="12"

# Container type (0=privileged, 1=unprivileged)
CT_TYPE="1"

# =============================================================================
# NETWORK SETTINGS
# =============================================================================

# Network type (dhcp or static)
NET_TYPE="dhcp"

# Static IP (required if NET_TYPE=static, include CIDR, e.g., 192.168.1.100/24)
STATIC_IP=""

# Gateway (required if NET_TYPE=static)
GATEWAY=""

# VLAN ID (optional)
VLAN=""

# MTU (optional, default is 1500)
MTU=""

# =============================================================================
# SSH SETTINGS
# =============================================================================

# SSH public key for root access (optional)
SSH_AUTHORIZED_KEY=""

# Root password (optional, will prompt if not set)
SSH_ROOT_PASSWORD=""

# =============================================================================
# DOCKER SETTINGS
# =============================================================================

# Docker image to deploy (required)
# Examples: nginx:latest, hello-world, ghcr.io/user/app:v1.0
DOCKER_IMAGE=""

# Port mappings (comma-separated)
# Format: HOST_PORT:CONTAINER_PORT
# Examples: "80:80" or "80:80,443:443,8080:8080"
DOCKER_PORTS=""

# Volume mounts (comma-separated)
# Format: HOST_PATH:CONTAINER_PATH[:OPTIONS]
# Examples: "/data:/app/data" or "/config:/etc/app:ro,/data:/var/data"
DOCKER_VOLUMES=""

# Environment variables (comma-separated)
# Format: VAR_NAME=value
# Examples: "TZ=UTC" or "TZ=UTC,DEBUG=true,API_KEY=secret"
DOCKER_ENV=""

# Restart policy (no, always, unless-stopped, on-failure)
DOCKER_RESTART="unless-stopped"

# Additional docker run arguments
# Example: "--memory=512m --cpus=1.0 --privileged"
DOCKER_EXTRA_ARGS=""
