# Nginx Web Server Configuration
# Deploy nginx as an LXC service

var_cpu="1"
var_ram="512"
var_disk="4"
var_os="debian"
var_version="12"

DOCKER_IMAGE="nginx:alpine"
DOCKER_PORTS="80:80,443:443"
DOCKER_VOLUMES="/srv/nginx/html:/usr/share/nginx/html:ro,/srv/nginx/conf:/etc/nginx/conf.d:ro"
DOCKER_ENV="TZ=UTC"
DOCKER_RESTART="unless-stopped"
